version: '3.8'

services:
  coze-app:
    build: .
    container_name: coze-oauth-app
    ports:
      - "5000:5000"
    env_file:
      - .env  # 从外部 .env 文件读取环境变量
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

